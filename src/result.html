<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinguaLens</title>
    <link rel="stylesheet" href="result.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand"><span class="brand-mark"></span><span>LinguaLens</span></div>
      <div class="window-actions">
        <button id="pinButton" class="icon-button" title="置顶">◇</button>
        <button id="minimizeButton" class="icon-button" title="最小化">—</button>
        <button id="closeButton" class="icon-button danger" title="隐藏">×</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div>
          <div class="eyebrow">SCREEN TRANSLATION, SIMPLIFIED</div>
          <h1>看见，即翻译。</h1>
          <p>本地 OCR、原位覆盖，并可持续监听固定区域的画面变化。</p>
        </div>
        <button id="captureButton" class="primary-button"><span>⌖</span>开始截取</button>
      </section>

      <section class="status-card">
        <div class="status-row">
          <div><span id="phaseDot" class="phase-dot"></span><strong id="statusText">等待截取</strong></div>
          <span id="metaText" class="meta-text">Alt+Shift+T</span>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="errorText" class="error-text" hidden></div>
      </section>

      <section id="previewCard" class="preview-card" hidden>
        <img id="previewImage" alt="截取区域" />
        <div class="privacy-badge">仅内存处理</div>
      </section>

      <section class="translation-grid">
        <article class="text-card">
          <div class="card-heading"><span>识别文本</span><span id="confidenceText" class="confidence"></span></div>
          <textarea id="sourceText" placeholder="截取后，OCR 文本会显示在这里。"></textarea>
        </article>
        <article class="text-card translated-card">
          <div class="card-heading"><span>翻译结果</span><span id="providerText" class="confidence"></span></div>
          <div id="translatedText" class="translated-text empty">等待翻译结果…</div>
        </article>
      </section>

      <section class="action-bar">
        <button id="retryButton" class="secondary-button">重新翻译</button>
        <button id="overlayButton" class="secondary-button">覆盖到原区域</button>
        <button id="liveButton" class="secondary-button">开始实时翻译</button>
        <button id="copyButton" class="secondary-button">复制译文</button>
        <button id="settingsButton" class="secondary-button">设置</button>
      </section>
    </main>

    <aside id="settingsPanel" class="settings-panel" aria-hidden="true">
      <div class="settings-header">
        <div><div class="eyebrow">PREFERENCES</div><h2>设置</h2></div>
        <button id="settingsCloseButton" class="icon-button">×</button>
      </div>
      <form id="settingsForm">
        <label>截取翻译快捷键<input id="captureHotkeyInput" type="text" placeholder="Alt+Shift+T" autocomplete="off" /></label>
        <label>屏幕翻译快捷键<input id="screenTranslationHotkeyInput" type="text" placeholder="Shift+Alt+G" autocomplete="off" /></label>
        <label>目标语言
          <select id="targetLanguageInput">
            <option value="zh-CN">简体中文</option><option value="en">英语</option><option value="ja">日语</option>
            <option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option>
            <option value="es">西班牙语</option><option value="ru">俄语</option>
          </select>
        </label>
        <label>OCR 语言包
          <select id="ocrLanguagesInput">
            <option value="eng+chi_sim+jpn+kor">中英日韩（推荐）</option>
            <option value="eng+chi_sim">中英</option><option value="eng+jpn">英日</option>
            <option value="eng+kor">英韩</option><option value="eng">仅英语</option>
          </select>
        </label>
        <label>实时翻译刷新间隔
          <select id="liveIntervalInput">
            <option value="800">0.8 秒（高性能设备）</option>
            <option value="1000">1 秒</option>
            <option value="1500">1.5 秒（推荐）</option>
            <option value="2500">2.5 秒</option>
            <option value="4000">4 秒（更省资源）</option>
          </select>
        </label>
        <fieldset>
          <legend>翻译引擎</legend>
          <div class="provider-options">
            <label><input type="radio" name="provider" value="free" />免配置翻译（自动回退）</label>
            <label><input type="radio" name="provider" value="openai" />OpenAI 兼容</label>
            <label><input type="radio" name="provider" value="ollama" />本地 Ollama</label>
          </div>
        </fieldset>
        <div id="openaiFields" class="provider-fields">
          <label>API Base URL<input id="openaiBaseUrlInput" type="url" /></label>
          <label>模型<input id="openaiModelInput" type="text" /></label>
          <label>API Key<input id="openaiApiKeyInput" type="password" autocomplete="new-password" /></label>
        </div>
        <div id="ollamaFields" class="provider-fields">
          <label>Ollama URL<input id="ollamaBaseUrlInput" type="url" /></label>
          <label>模型<input id="ollamaModelInput" type="text" /></label>
        </div>
        <p class="settings-note">快捷键格式使用 Electron 组合键，例如 Ctrl+Alt+T、Alt+Shift+G。两组快捷键不能相同；屏幕翻译会在独立窗口显示，不会覆盖截取翻译结果。实时翻译只在画面变化超过阈值时重新 OCR，可减少无效识别和翻译请求。</p>
        <div id="settingsError" class="error-text" hidden></div>
        <button class="primary-button save-button" type="submit">保存设置</button>
      </form>
    </aside>
    <div id="toast" class="toast" hidden></div>
    <script src="result.js"></script>
  </body>
</html>
